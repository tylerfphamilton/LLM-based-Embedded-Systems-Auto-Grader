# LLM settings for `grader make-plan` and `--feedback llm`. The API key is never stored
# here: export ANTHROPIC_API_KEY instead.
#
# Model IDs from Anthropic's docs
# (https://platform.claude.com/docs/en/about-claude/models/overview). A single
# `model: <id>` is used for both. Opus writes more reliable plans (more thorough stimuli,
# fewer timing mistakes; docs/decisions.md D61); a plan is made once per assignment, so
# the larger model is cheap there. Feedback runs once per failing submission: Sonnet.
model:
  plan: claude-opus-5-5     # grader make-plan
  feedback: claude-sonnet-5 # --feedback llm
  # code_grade: <id>        # grader code-grade baseline (D66); default: the feedback model

max_tokens:
  plan: 32000       # a plan is a few KB of JSON; leave room for the model to think
  feedback: 8000    # includes thinking; one hard no-signal sketch used >4000
  code_grade: 16000 # grader code-grade: the requirement list and each submission's grade
                    # (10-12 verdicts plus thinking; 2 of 10 UART sketches passed 8000)

# The Messages API rejects `temperature` since API version 2026-10-21 (anthropic SDK >= 2.0),
# so it must stay null. See docs/decisions.md D36.
temperature: null

timeout_s: 300     # per request; must cover the largest max_tokens above at ~90 output tokens/s
                    # (16000 / 90 = ~180 s). At 120 s a long code-grade answer timed out and the
                    # SDK silently retried it, so the run hung for ~6 minutes.
max_retries: 2      # the SDK retries 408/409/429/5xx and connection errors itself

# false -> tool_choice {"type": "auto"}; the prompt tells the model which tool to call, and
#          make-plan retries if it answers in plain text instead (D39).
# true  -> tool_choice {"type": "tool", "name": ...}. Current models such as Claude Opus 5.5,
#          Sonnet 5.5 and Fable 5.1 reject this with a 400; only enable it for a model that
#          accepts forced tool use. See docs/decisions.md D37.
force_tool: false

# List prices in USD per million tokens of the *feedback* model, used only to report cost
# in `batch` output (summary.csv and the printed totals). Copy them from Anthropic's pricing
# page (https://platform.claude.com/docs/en/about-claude/pricing); leave them null to report
# tokens without a cost. Sonnet 5 list price as of 2026-10-25: $2 in / $10 out.
# Other models can be priced by id (cost is looked up by the model used; an unpriced model
# reports tokens with a blank cost), e.g. for a code-grade run with --model:
#   claude-opus-5-5: { input: ..., output: ... }
price_per_mtok:
  input: 2.00
  output: 10.00

# Per-student values (plan params, docs/decisions.md D63) replaced by <name> in every
# feedback request, and put back into the accepted explanations afterwards. Short derived
# values such as a digit sum would match unrelated text, so only list identifying ones.
redact_params: [student_id]
