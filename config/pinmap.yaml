# Student board (Arduino Nano 33 BLE Sense) pin name -> measuring board (Nucleo-L476RG) pin.
# Capabilities are from the MEASURING board's point of view (uart_rx = STM32 receives).
#
# Wiring facts (D69), used only for the wiring guides (`grader wiring`), not in the hash:
#   header      label printed on the Nucleo board next to the pin (Arduino header)
#   series_ohms resistor in series on that wire; missing = direct wire
#   note        what the wire is for
#
# !!! Every stm32 value is a PLACEHOLDER until verified in STM32CubeMX against the wiring. !!!
pins:
  D5:  { stm32: PA0,  caps: [gpio, timer_capture, analog_in], header: A0,
         note: "TIM2_CH1 input capture (FREQ); ADC12_IN5 (ADC of a PWM average)" }
  D2:  { stm32: PA8,  caps: [gpio, drive], header: D7, series_ohms: 1000,
         note: "STM32 drives the student's button input" }
  D13: { stm32: PB3,  caps: [gpio, timer_capture], header: D3,
         note: "Nano on-board LED; TIM2_CH2" }
  D1:  { stm32: PA10, caps: [uart_rx], header: D2,
         note: "Nano Serial1 TX -> STM32 USART1 RX" }
  D0:  { stm32: PA9,  caps: [uart_tx], header: D8, series_ohms: 1000,
         note: "Nano Serial1 RX <- STM32 USART1 TX" }
  A0:  { stm32: PA4,  caps: [analog_in, dac], header: A2, series_ohms: 1000,
         note: "Nano analog input <- STM32 DAC1_OUT1 (DAC); PA4 is also ADC12_IN9" }
  A4:  { stm32: TBD,  caps: [i2c_sda],                # placeholder
         note: "STM32 acts as I2C target" }
  A5:  { stm32: TBD,  caps: [i2c_scl] }               # placeholder
  # Rig only, never used by a plan: open-drain line from the STM32 to the Nano's RST pin.
  RST: { stm32: PA1,  caps: [reset], header: A1,
         note: "Nano RST (open-drain, pulled low to reset)" }
