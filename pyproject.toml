[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grader"
version = "0.1.0"
description = "Host-side backbone of an LLM-assisted autograder for Arduino embedded-systems assignments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sean Hashem" }, { name = "Tyler Hamilton" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
llm = ["anthropic>=2.0"]  # 2.x sends API version 2026-10-21 (no temperature)
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
grader = "grader.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grader = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: calls the real Anthropic API (needs ANTHROPIC_API_KEY; run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # we deliberately use ≈, ±, ≤ in report text
