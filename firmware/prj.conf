# Kconfig settings (turns off everything that would print to COM7, like the "Booting Zephyr", so only protocol replies are transmitted)
# print to it, no console, printk, no logging

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# Host link (interrupt driven UART)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# man thread parses lines up to 1024 bytes on its stack
CONFIG_MAIN_STACK_SIZE=4096
