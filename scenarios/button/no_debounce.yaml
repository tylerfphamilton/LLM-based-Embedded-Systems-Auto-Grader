submission: button_no_debounce
assignment: button_toggle
sketch: benchmark/button_toggle/no_debounce
description: No debouncing. Each of the 5 bounce edges toggles the LED and prints a message.
ground_truth: { faulty: true, fault: no_debounce }
responses:
  - match: { cmd: DELAY }
    replies:
      - { delay_ms: 0.4, to_edge_count: 5 }
      - { delay_ms: 0.4, to_edge_count: 5 }
  - match: { cmd: UART }
    replies:
      - { text: "ON\r\nOFF\r\nON\r\nOFF\r\nON\r\n", byte_count: 22, framing_errors: 0 }
      - { text: "OFF\r\nON\r\nOFF\r\nON\r\nOFF\r\n", byte_count: 23, framing_errors: 0 }
  - match: { cmd: TRACE, pin: D13 }
    reply: { edge_count: 3, final_level: 0, edges_ms: [5.2, 7.3, 9.1] }
  - match: { cmd: TRACE, pin: D2 }
    reply: { edge_count: 0, final_level: 1, edges_ms: [] }
expected_verdicts:
  press1_led.delay_ms: PASS
  press1_led.to_edge_count: FAIL
  press1_msg.text: FAIL
  press1_msg.framing_errors: PASS
  press2_led.delay_ms: PASS
  press2_led.to_edge_count: FAIL
  press2_msg.text: FAIL
  press2_msg.framing_errors: PASS
  release1_led.edge_count: FAIL
  release1_led.final_level: FAIL
  pullup.final_level: PASS
